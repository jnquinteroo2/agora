name: agora-prod

services:
  migrate:
    image: ${MIGRATE_IMAGE:?MIGRATE_IMAGE requerida}
    env_file: /run/secrets/agora-env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  proxy:
    image: traefik:3
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_certs:/letsencrypt
    networks:
      - edge
    restart: always
    security_opt:
      - no-new-privileges:true

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE requerida}
    env_file: /run/secrets/agora-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - edge
      - internal
    restart: always
    read_only: true
    tmpfs:
      - /tmp
    user: "1001:1001"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
    volumes:
      - storage:/var/agora/storage:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`${DOMINIO:?}`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web.middlewares=security-headers@file"
      - "traefik.http.services.web.loadbalancer.server.port=3000"

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: agora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db-superuser-password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      DB_MIGRACIONES_PASSWORD_FILE: /run/secrets/db-migraciones-password
      DB_APP_PASSWORD_FILE: /run/secrets/db-app-password
      DB_BACKUP_PASSWORD_FILE: /run/secrets/db-backup-password
    secrets:
      - db-superuser-password
      - db-migraciones-password
      - db-app-password
      - db-backup-password
    volumes:
      - db_data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    restart: always
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agora"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  pdf:
    image: ${PDF_IMAGE:?PDF_IMAGE requerida}
    env_file: /run/secrets/agora-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    restart: always
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
      - seccomp:./worker/seccomp-chromium.json
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 768M
    volumes:
      - storage:/var/agora/storage

  backup:
    image: ${BACKUP_IMAGE:?BACKUP_IMAGE requerida}
    secrets:
      - db-backup-password
      - backup-age-key
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: always
    volumes:
      - backups:/backups
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: agora
      PGUSER: agora_backup
      PGPASSWORD_FILE: /run/secrets/db-backup-password
      BACKUP_RETAIN_DAYS: 30

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  db_data:
  storage:
  backups:
  traefik_certs:

secrets:
  db-superuser-password:
    file: /run/secrets/db-superuser-password
  db-migraciones-password:
    file: /run/secrets/db-migraciones-password
  db-app-password:
    file: /run/secrets/db-app-password
  db-backup-password:
    file: /run/secrets/db-backup-password
  agora-env:
    file: /run/secrets/agora-env
  backup-age-key:
    file: /run/secrets/backup-age-key
