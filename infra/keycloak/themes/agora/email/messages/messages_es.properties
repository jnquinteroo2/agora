executeActionsSubject=Active su cuenta de la plataforma del Colegio Ágora
executeActionsBody=La administración del Colegio Ágora creó o actualizó su cuenta de la plataforma. Para usarla debe completar lo siguiente: {3}.\n\nAbra este enlace para empezar:\n\n{0}\n\nEl enlace vence en {4}. Si ya venció, pida a la administración del colegio que le envíe uno nuevo.\n\nSi usted no esperaba este correo, no haga nada: su cuenta no cambiará.
executeActionsBodyHtml=<p>La administración del Colegio Ágora creó o actualizó su cuenta de la plataforma. Para usarla debe completar lo siguiente: {3}.</p><p><a href="{0}">Activar mi cuenta</a></p><p>El enlace vence en {4}. Si ya venció, pida a la administración del colegio que le envíe uno nuevo.</p><p>Si usted no esperaba este correo, no haga nada: su cuenta no cambiará.</p>
passwordResetSubject=Restablecer su contraseña de la plataforma del Colegio Ágora
